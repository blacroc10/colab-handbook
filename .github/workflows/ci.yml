# CI for the handbook itself. Two outcomes, per CONVENTIONS.md §7:
# a secret scan and a build/verify. "Build" here means: the CLI parses,
# the installer parses, and the handbook passes its own audit tool —
# a handbook that fails its own conventions is anti-pattern #4.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      # Pinned binary instead of gitleaks-action v2: the action requires a
      # GITLEAKS_LICENSE for org-owned repos; the binary is MIT and free.
      - name: Install gitleaks (pinned binary)
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks.tar.gz
      - name: gitleaks detect
        run: gitleaks detect --source . --no-banner

  self-check:
    name: Self-audit + syntax
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so the audit's trunk-existence check can see real local branch
      # refs on a pull_request run too — a shallow, detached checkout has none, and the
      # audit used to misread that as "trunk does not exist" rather than "unverifiable"
      # (#104). The audit itself was also fixed to treat a branchless detached HEAD as
      # not-evaluable, so this is belt-and-suspenders, not the only fix.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
      - name: Syntax-check the CLI and audit tool
        run: |
          node --check tools/colab
          for f in tools/lib/*.js audit/audit.mjs; do node --check "$f"; done
          sh -n install.sh
      # A syntax check reads bytes; it does not read like a human. Two raw NULs once made the CLI
      # read as "binary data" to file(1) and invisible to grep without -a, while node --check, the
      # tests, git diff and the audit all stayed green. Cheap byte scan, catches the whole class.
      - name: No stray control bytes in tracked text files
        run: node scripts/check-text-bytes.mjs
      # The stamp heuristic decides whether a repo's file is "ours". A false positive there ends in
      # advice to overwrite that file, so it is the one piece of logic here with unit tests.
      #
      # This step is fail-open by default: if NODE_TEST_CONTEXT/NODE_TEST_WORKER_ID leak in from a
      # parent process, `node --test` decides it is already running as a child test run, skips
      # everything, and still exits 0 (#154). A hosted runner starts clean so that specific cause is
      # not believed to hit here today, but the check below is not about that one cause — it also
      # catches a glob matching zero files after a rename, or a runner image change, the same way.
      # `-u` on unset vars is a harmless no-op, so scrubbing is safe even when nothing leaked.
      #
      # `set -o pipefail` is NOT implied here. This repo declares no `shell:`, so a Linux `run:`
      # block is invoked as `bash -e {0}` — `-e` only, no `-o pipefail` (that combination is only
      # what `shell: bash` gets). Piping `node --test | tee …` without it made `tee`'s always-0 exit
      # the step's exit, silently turning a genuine failing test into a passing step — a wider
      # fail-open than the one this change closes. Measured: a deliberately failing test under
      # `bash -e {0}` exactly as the runner invokes it exits 0 without the line below, 1 with it.
      - name: Unit tests
        run: |
          set -o pipefail
          env -u NODE_TEST_CONTEXT -u NODE_TEST_WORKER_ID \
            node --test --test-reporter=tap tools/lib/*.test.js | tee /tmp/unit-tests.tap
          ran="$(grep -oE '^# tests [0-9]+' /tmp/unit-tests.tap | grep -oE '[0-9]+' || true)"
          failed="$(grep -oE '^# fail [0-9]+' /tmp/unit-tests.tap | grep -oE '[0-9]+' || true)"
          if [ -z "$ran" ] || [ "$ran" -eq 0 ]; then
            echo "::error::node --test reported zero tests run — this step is supposed to fail closed, not silently pass (see #154)" >&2
            exit 1
          fi
          if [ -z "$failed" ] || [ "$failed" -ne 0 ]; then
            echo "::error::node --test reported $failed failing test(s) — pipefail should already have failed this step; this is belt-and-suspenders (see #154)" >&2
            exit 1
          fi
          echo "Ran $ran test(s), 0 failed."

      - name: Audit the handbook against its own conventions
        run: node audit/audit.mjs --local .
